# Optional. Detects newer images and writes /srv/data/trivy/reports/updates.json.
# DIUN does not pull images and does not restart containers.
# No watch.schedule: `diun serve` checks once and exits.
# scripts/scan.sh runs that from the nightly cron job when DIUN_ENABLED=true.
# Do not leave a DIUN container running.

name: diun

services:
  diun:
    image: crazymax/diun:latest
    profiles: ["cron"]
    command: ["serve"]
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      TZ: ${TZ:-UTC}
      LOG_LEVEL: info
      LOG_JSON: "false"
      SERVER_ID: ${SERVER_ID:-unknown}
      DIUN_HOSTNAME: ${SERVER_ID:-unknown}
      REPORTS_DIR: /reports
      DIUN_DB_PATH: /data/diun.db
      DIUN_WATCH_WORKERS: "10"
      DIUN_WATCH_FIRSTCHECKNOTIF: "false"
      DIUN_PROVIDERS_DOCKER: "true"
      DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT: "true"
      DIUN_PROVIDERS_DOCKER_WATCHSTOPPED: "false"
      DIUN_NOTIF_SCRIPT_CMD: /bin/sh
      DIUN_NOTIF_SCRIPT_ARGS: /diun-notify.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/data/trivy/diun:/data
      - /srv/data/trivy/reports:/reports
      - ./scripts/diun-notify.sh:/diun-notify.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
